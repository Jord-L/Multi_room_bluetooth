; PlatformIO Project Configuration File
; ESP32 Multi-Room Speaker System - Phase 1
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    ; Phase 1 feature flags
    -DENABLE_MDNS=1
    -DENABLE_WEBSOCKET=1
    -DENABLE_OTA=1

; Upload settings
upload_speed = 921600

; Dependencies for Phase 1
lib_deps =
    ; WiFi and network
    https://github.com/tzapu/WiFiManager.git
    ; WebSocket server
    links2004/WebSockets@^2.4.1
    ; JSON parsing and serialization
    bblanchon/ArduinoJson@^6.21.3
    ; mDNS (built into ESP32 core)
    ; Preferences library (built into ESP32 core)
    ; Audio processing
    earlephilhower/ESP8266Audio@^1.9.7
    ; I2S audio output (built into ESP32 core)
    ; Bluetooth A2DP audio sink (for receiving audio via Bluetooth)
    https://github.com/pschatzmann/ESP32-A2DP.git

; Filesystem for configuration storage
board_build.filesystem = littlefs

; Partition scheme - OTA compatible
board_build.partitions = default.csv

; Extra scripts for build automation
;extra_scripts =
;    pre:scripts/prebuild.py
;    post:scripts/postbuild.py
